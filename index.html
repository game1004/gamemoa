<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록 쌓기 – 테트리스</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef1;--panel:#fbfcfc;--ink:#1c2a38;--mute:#5d6e7d;--line:#cfd9e0;--btn:#1c2a38;--btnt:#fbfcfc;--grid:#e3eaee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17212b;--panel:#202d3a;--ink:#e8eef2;--mute:#93a4b3;--line:#33465a;--btn:#e8eef2;--btnt:#17212b;--grid:#1b2833}}
:root[data-theme="dark"]{--bg:#17212b;--panel:#202d3a;--ink:#e8eef2;--mute:#93a4b3;--line:#33465a;--btn:#e8eef2;--btnt:#17212b;--grid:#1b2833}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
h1{font-family:'Do Hyeon','Apple SD Gothic Neo',sans-serif;font-weight:400;font-size:clamp(2.4rem,8vw,3.6rem);letter-spacing:-.02em;line-height:1.1;margin:8px 0 6px}
.sub{color:var(--mute);margin:0 0 20px;max-width:46ch}
.game{display:flex;gap:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.board{position:relative;border:2px solid var(--ink);border-radius:6px;background:var(--grid);line-height:0;max-width:100%}
canvas{display:block}
#c{width:min(300px,62vw);height:auto;aspect-ratio:1/2}
.side{display:flex;flex-direction:column;gap:12px;width:150px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.box b{display:block;font-weight:400;color:var(--mute);font-size:.85rem}
.box span{font-family:'Do Hyeon',sans-serif;font-size:1.7rem;line-height:1.2}
#n{width:100%;height:auto;margin-top:4px}
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;line-height:1.5;padding:16px}
.ov strong{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:2rem}
button{font:inherit;background:var(--btn);color:var(--btnt);border:0;border-radius:6px;padding:10px 20px;cursor:pointer}
button:focus-visible{outline:3px solid #2f7fd8;outline-offset:2px}
.keys{color:var(--mute);font-size:.9rem;margin:0}
.pad{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.pad button{padding:14px 0;font-size:1.1rem;touch-action:manipulation}
@media (pointer:coarse){.pad{display:grid}.keys{display:none}}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>블록 쌓기</h1>
<p class="sub">줄을 채워 없애세요. 레벨이 오를수록 블록이 빨리 떨어집니다.</p>
<div class="game">
  <div class="board">
    <canvas id="c" width="300" height="600" aria-label="테트리스 게임판"></canvas>
    <div class="ov" id="ov"><strong id="ovt">테트리스</strong><span id="ovs" class="keys">← → 이동 · ↑ 회전 · 스페이스 즉시 낙하</span><button id="go">게임 시작</button></div>
  </div>
  <div class="side">
    <div class="box"><b>점수</b><span id="sc">0</span></div>
    <div class="box"><b>줄</b><span id="ln">0</span></div>
    <div class="box"><b>레벨</b><span id="lv">1</span></div>
    <div class="box"><b>다음 블록</b><canvas id="n" width="120" height="90"></canvas></div>
    <p class="keys">↓ 빠르게 · P 일시정지</p>
  </div>
</div>
<div class="pad" id="pad">
  <button data-a="l" aria-label="왼쪽">◀</button><button data-a="r" aria-label="오른쪽">▶</button><button data-a="rot">회전</button><button data-a="drop">낙하</button>
</div>
</main>
<script>
(function(){
var W=10,H=20,S=30;
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var nv=document.getElementById('n'),nx=nv.getContext('2d');
var COL={I:'#3aa6b9',O:'#e3b73b',T:'#8b6bc4',S:'#5aa469',Z:'#d4584e',J:'#3d6fc0',L:'#e08a3c'};
var SH={I:[[0,0],[1,0],[2,0],[3,0]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[0,0],[1,0],[2,0],[1,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
var KEYS=Object.keys(SH);
var grid,cur,next,score,lines,level,over,paused,running,last,acc,bag=[];
function $(i){return document.getElementById(i)}
function take(){if(!bag.length){bag=KEYS.slice();for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t}}return bag.pop()}
function mk(t){return{t:t,c:SH[t].map(function(p){return[p[0],p[1]]}),x:t==='I'?3:3,y:0}}
function ok(c,x,y){for(var i=0;i<c.length;i++){var a=c[i][0]+x,b=c[i][1]+y;if(a<0||a>=W||b>=H)return false;if(b>=0&&grid[b][a])return false}return true}
function rotated(p){if(p.t==='O')return p.c;var m=p.t==='I'?3:2,r=p.c.map(function(q){return[m-q[1],q[0]]});
 if(p.t!=='I'){var cs=p.c;r=cs.map(function(q){return[2-q[1],q[0]]})}return r}
function reset(){grid=[];for(var i=0;i<H;i++)grid.push(new Array(W).fill(0));score=0;lines=0;level=1;over=false;paused=false;acc=0;bag=[];next=mk(take());spawn();ui()}
function spawn(){cur=next;next=mk(take());cur.x=3;cur.y=0;if(!ok(cur.c,cur.x,cur.y)){over=true;running=false;show('게임 오버','점수 '+score+' · '+lines+'줄','다시 하기')}}
function show(t,s,b){$('ovt').textContent=t;$('ovs').textContent=s;$('go').textContent=b;$('ov').classList.remove('hide');$('go').focus()}
function ui(){$('sc').textContent=score;$('ln').textContent=lines;$('lv').textContent=level}
function lock(){cur.c.forEach(function(p){var b=p[1]+cur.y;if(b>=0)grid[b][p[0]+cur.x]=cur.t});
 var n=0;for(var y=H-1;y>=0;y--){if(grid[y].every(function(v){return v})){grid.splice(y,1);grid.unshift(new Array(W).fill(0));n++;y++}}
 if(n){score+=[0,100,300,500,800][n]*level;lines+=n;level=1+Math.floor(lines/10)}ui();spawn()}
function move(dx){if(ok(cur.c,cur.x+dx,cur.y)){cur.x+=dx;return true}return false}
function down(){if(ok(cur.c,cur.x,cur.y+1)){cur.y++;return true}lock();return false}
function rot(){var r=rotated(cur);var k=[0,-1,1,-2,2];for(var i=0;i<k.length;i++){if(ok(r,cur.x+k[i],cur.y)){cur.c=r;cur.x+=k[i];return}}}
function drop(){var d=0;while(ok(cur.c,cur.x,cur.y+1)){cur.y++;d++}score+=d*2;lock()}
function ghostY(){var y=cur.y;while(ok(cur.c,cur.x,y+1))y++;return y}
function cell(c,x,y,col,s,a){c.globalAlpha=a||1;c.fillStyle=col;c.fillRect(x*s+1,y*s+1,s-2,s-2);c.fillStyle='rgba(255,255,255,.28)';c.fillRect(x*s+1,y*s+1,s-2,4);c.globalAlpha=1}
function draw(){cx.clearRect(0,0,W*S,H*S);cx.strokeStyle='rgba(120,140,155,.18)';cx.lineWidth=1;
 for(var i=1;i<W;i++){cx.beginPath();cx.moveTo(i*S+.5,0);cx.lineTo(i*S+.5,H*S);cx.stroke()}
 for(var j=1;j<H;j++){cx.beginPath();cx.moveTo(0,j*S+.5);cx.lineTo(W*S,j*S+.5);cx.stroke()}
 for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(grid[y][x])cell(cx,x,y,COL[grid[y][x]],S);
 if(cur&&!over){var g=ghostY();cur.c.forEach(function(p){cell(cx,p[0]+cur.x,p[1]+g,COL[cur.t],S,.25)});cur.c.forEach(function(p){cell(cx,p[0]+cur.x,p[1]+cur.y,COL[cur.t],S)})}
 nx.clearRect(0,0,120,90);if(next){var xs=next.c.map(function(p){return p[0]}),ys=next.c.map(function(p){return p[1]});var w=Math.max.apply(0,xs)+1,h=Math.max.apply(0,ys)+1,s=24,ox=(120-w*s)/2/s,oy=(90-h*s)/2/s;next.c.forEach(function(p){cell(nx,p[0]+ox,p[1]+oy,COL[next.t],s)})}}
function loop(t){if(running&&!paused){var sp=Math.max(80,800-(level-1)*70);acc+=t-last;while(acc>=sp&&running){acc-=sp;down()}}last=t;draw();requestAnimationFrame(loop)}
function start(){reset();running=true;$('ov').classList.add('hide');last=performance.now()}
$('go').onclick=function(){if(paused){toggle()}else start()};
function toggle(){if(!running)return;paused=!paused;if(paused)show('일시정지','P 키로 계속하기','계속하기');else $('ov').classList.add('hide')}
function act(a){if(!running||paused||over)return;if(a==='l')move(-1);else if(a==='r')move(1);else if(a==='rot')rot();else if(a==='drop')drop();else if(a==='d'){if(down())score+=1;ui()}ui()}
document.addEventListener('keydown',function(e){var k=e.key;
 if(k==='p'||k==='P'){toggle();return}
 var m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'rot',ArrowDown:'d',' ':'drop'};
 if(m[k]){if(document.activeElement===$('go')&&k===' '&&!running)return;e.preventDefault();act(m[k])}});
document.querySelectorAll('#pad button').forEach(function(b){b.addEventListener('click',function(){act(b.dataset.a)})});
reset();running=false;requestAnimationFrame(loop);
})();
</script>
</body>
</html>
